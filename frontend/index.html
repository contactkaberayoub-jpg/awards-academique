<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--
      Santioni Spirits reference uses a tall, condensed, high-contrast
      serif for both big display headlines ("INDULGE NOW / ATONE LATER")
      and small caption/eyebrow labels ("SELECT HOUSES / FORTHCOMING"),
      with a plainer serif for body copy.

      Big display headlines use Bodoni Moda — a variable Didone serif
      with a width (wdth) axis pulled toward "condensed", giving the
      tall, high-contrast look of the reference site's big titles.

      Small captions/labels and body paragraphs use PT Serif instead —
      a plainer, lower-contrast book serif that matches the reference
      site's justified paragraph copy and small uppercase labels.

      Inter is kept only as a fallback / for any plain UI chrome
      (form inputs) that shouldn't be set in either serif.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
