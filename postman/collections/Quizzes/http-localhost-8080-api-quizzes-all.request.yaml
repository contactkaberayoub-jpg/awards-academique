$kind: http-request
name: http://localhost:8080/api/quizzes (get all)
description: Lists all quizzes visible to the authenticated instructor.
url: http://localhost:8080/api/quizzes
method: GET
auth:
  type: bearer
  credentials:
    token: "{{instructor_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get all quizzes returns 200", function() {
          pm.response.to.have.status(200);
      });

      pm.test("Response is an array", function() {
          pm.expect(pm.response.json()).to.be.an("array");
      });
order: 600
