$kind: http-request
name: http://localhost:8080/api/quizzes/{{quiz_id}}/archive
description: Archives the published quiz referenced by the quiz_id variable (administrator only).
url: http://localhost:8080/api/quizzes/{{quiz_id}}/archive
method: POST
auth:
  type: bearer
  credentials:
    token: "{{admin_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Archive quiz returns 200", function() {
          pm.response.to.have.status(200);
      });

      pm.test("Quiz status is archived", function() {
          const body = pm.response.json();
          pm.expect(body.id).to.eql(pm.collectionVariables.get("quiz_id"));
          pm.expect(body.status).to.eql("archived");
      });
order: 900
