$kind: http-request
name: http://localhost:8080/api/quizzes/{{quiz_id}} (get by id)
description: Reads the quiz created by the create request using the quiz_id collection variable.
url: http://localhost:8080/api/quizzes/{{quiz_id}}
method: GET
auth:
  type: bearer
  credentials:
    token: "{{instructor_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get quiz by id returns 200", function() {
          pm.response.to.have.status(200);
      });

      pm.test("Returns the created quiz", function() {
          const body = pm.response.json();
          pm.expect(body.id).to.eql(pm.collectionVariables.get("quiz_id"));
          pm.expect(body.title).to.eql("Introductory Physics Quiz");
          pm.expect(body.courseId).to.eql(pm.collectionVariables.get("course_id"));
      });
order: 400
