$kind: http-request
name: http://localhost:8080/api/auth/login (instructor)
description: Logs in as an instructor and stores the JWT in the instructor_token collection variable.
url: http://localhost:8080/api/auth/login
method: POST
body:
  type: json
  content: '{"email": "{{instructor_email}}", "password": "{{instructor_password}}"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Login status is 200", function() {
          pm.response.to.have.status(200);
      });

      pm.test("Instructor token is stored", function() {
          const body = pm.response.json();
          pm.expect(body.token).to.be.a("string").and.to.not.be.empty;
          pm.collectionVariables.set("instructor_token", body.token);
      });
order: 100
