$kind: http-request
name: http://localhost:8080/api/auth/login (admin)
description: Logs in as an administrator and stores the JWT in the admin_token collection variable.
url: http://localhost:8080/api/auth/login
method: POST
body:
  type: json
  content: '{"email": "{{admin_email}}", "password": "{{admin_password}}"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Login status is 200", function() {
          pm.response.to.have.status(200);
      });

      pm.test("Admin token is stored", function() {
          const body = pm.response.json();
          pm.expect(body.token).to.be.a("string").and.to.not.be.empty;
          pm.collectionVariables.set("admin_token", body.token);
      });
order: 200
