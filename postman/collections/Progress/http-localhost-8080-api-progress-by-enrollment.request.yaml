$kind: http-request
name: Get Progress By Enrollment
description: >-
  Lists every progress row for the enrollment (ordered by lesson display
  order). Used to render the full course progress list.
url: http://localhost:8080/api/progress/enrollments/{{enrollmentId}}
method: GET
body:
  type: none
auth:
  type: bearer
  token: "{{student_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get by enrollment returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Result is an array containing the test lesson", function () {
          const body = pm.response.json();
          pm.expect(body).to.be.an("array");
          const lessonId = pm.collectionVariables.get("lesson_id");
          const hasLesson = body.some((p) => p.lessonId === lessonId);
          pm.expect(hasLesson).to.eql(true);
      });
order: 500
