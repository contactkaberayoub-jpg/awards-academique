$kind: http-request
name: Update Progress (toggle back)
description: >-
  Toggles the isCompleted flag back to false via the generic PUT endpoint.
  Used to verify update access control + data mutation.
url: http://localhost:8080/api/progress/{{progressId}}
method: PUT
body:
  type: json
  json:
    completed: false
auth:
  type: bearer
  token: "{{student_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Update progress returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Progress was un-marked completed", function () {
          const body = pm.response.json();
          pm.expect(body.id).to.eql(pm.collectionVariables.get("progress_id"));
          pm.expect(body.isCompleted).to.eql(false);
      });
order: 600
