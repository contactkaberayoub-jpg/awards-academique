$kind: http-request
name: Login Admin
description: >-
  Authenticates the administrator user and stores the JWT in the admin_token
  collection variable.
url: http://localhost:8080/api/auth/login
method: POST
body:
  type: json
  json:
    email: "{{admin_email}}"
    password: "{{admin_password}}"
auth:
  type: none
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Login returns 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Admin token is captured", function () {
          const body = pm.response.json();
          pm.expect(body.token).to.be.a("string").and.to.not.be.empty;
          pm.collectionVariables.set("admin_token", body.token);
      });
order: 150
