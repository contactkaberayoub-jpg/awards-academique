$kind: http-request
name: Submit Attempt (correct answer)
description: >-
  Submits the attempt with one correct option for question A and checks the
  scoring, the passed flag, and the completed status.
url: http://localhost:8080/api/quiz-attempts/{{attempt_id}}/submit
method: POST
body:
  type: json
  json:
    answers:
      "{{question_id_a}}": "{{correct_option_id_a}}"
auth:
  type: bearer
  token: "{{student_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Submit returns 200", function () { pm.response.to.have.status(200); });
      pm.test("Attempt is completed with consistent score", function () {
          var body = pm.response.json();
          pm.expect(body.status).to.eql("completed");
          pm.expect(body.score).to.be.a("number").and.to.be.at.least(0).and.to.be.at.most(100);
          pm.expect(body.passed).to.be.a("boolean");
          pm.expect(body.submittedAt).to.exist;
          pm.expect(body.id).to.eql(pm.collectionVariables.get("attempt_id"));
      });
order: 300
