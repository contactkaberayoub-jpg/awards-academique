$kind: http-request
name: Get History By Quiz (admin)
url: http://localhost:8080/api/quiz-attempts/quizzes/{{quiz_id}}
method: GET
body:
  type: none
auth:
  type: bearer
  token: "{{admin_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Admin history by quiz returns 200", function () { pm.response.to.have.status(200); });
      pm.test("Result is a list of attempts", function () {
          var body = pm.response.json();
          pm.expect(body).to.be.an("array");
          body.forEach(function (a) {
              pm.expect(a.quizId).to.eql(pm.collectionVariables.get("quiz_id"));
          });
      });
order: 650
