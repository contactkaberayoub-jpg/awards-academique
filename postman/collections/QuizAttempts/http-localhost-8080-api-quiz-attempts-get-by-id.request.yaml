$kind: http-request
name: Get Attempt By Id
url: http://localhost:8080/api/quiz-attempts/{{attempt_id}}
method: GET
body:
  type: none
auth:
  type: bearer
  token: "{{student_token}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get by id returns 200", function () { pm.response.to.have.status(200); });
      pm.test("Attempt contains submitted answers + score", function () {
          var body = pm.response.json();
          pm.expect(body.id).to.eql(pm.collectionVariables.get("attempt_id"));
          pm.expect(body.answers).to.be.an("object");
          pm.expect(body.score).to.exist;
      });
order: 400
