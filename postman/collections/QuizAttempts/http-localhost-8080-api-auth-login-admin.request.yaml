$kind: http-request
name: Login Admin
url: http://localhost:8080/api/auth/login
method: POST
body:
  type: json
  json:
    email: "{{admin_email}}"
    password: "{{admin_password}}"
auth:
  type: none
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Login returns 200", function () { pm.response.to.have.status(200); });
      pm.test("Admin token captured", function () {
          var body = pm.response.json();
          pm.expect(body.token).to.be.a("string").and.to.not.be.empty;
          pm.collectionVariables.set("admin_token", body.token);
      });
order: 150
